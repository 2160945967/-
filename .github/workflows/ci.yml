name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: 类型检查 / 单测 / 构建（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 升级 npm 到 v11（与本地一致，正确尊重 gypfile:false，避免对 better-sqlite3 隐式触发 node-gyp）
        run: npm install -g npm@11

      - name: 安装依赖
        run: npm ci || npm install

      - name: 类型检查（渲染层）
        run: npm run typecheck

      - name: 类型检查（主进程）
        run: npm run typecheck:electron

      - name: 单元测试
        run: npm test

      - name: 构建渲染层
        run: npm run build

      - name: 编译主进程
        run: npm run prepackage && npm run electron:compile
