name: ci
displayName: 持续集成
triggers:
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      precise:
        - main
stages:
  - stage:
      name: check
      displayName: 类型检查与单元测试
      strategy: naturally
      trigger: auto
      steps:
        - step: build@nodejs
          name: node_check
          displayName: 类型检查与单元测试
          nodeVersion: '20.18.0'
          commands:
            - export ELECTRON_SKIP_BINARY_DOWNLOAD=1
            - npm config set registry https://registry.npmmirror.com
            - npm ci || npm install
            - npm run typecheck
            - npm test
