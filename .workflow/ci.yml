version: "1.0"
name: ci
displayName: 持续集成
triggers:
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      precise:
        - main
stages:
- name: check
  displayName: 类型检查与单元测试
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: node_check
    displayName: 类型检查与单元测试
    nodeVersion: 20.20.1
    commands:
    - export ELECTRON_SKIP_BINARY_DOWNLOAD=1
    - npm config set registry https://registry.npmmirror.com
    - npm ci || npm install
    - npm run typecheck
    - npm test
    caches:
    - "~/.npm"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
notify: []
strategy:
  blocking: true
